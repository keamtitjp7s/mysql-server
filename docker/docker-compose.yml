version: '3.9'

services:
  mysql-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runtime
    image: mysql-server:latest
    container_name: mysql-server-shiny
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shiny_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf:ro
    networks:
      - mysql-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
    driver: local

networks:
  mysql-net:
    driver: bridge
